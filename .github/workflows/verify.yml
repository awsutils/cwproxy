name: verify

on:
  push:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run performance delay check
        run: go test -run TestReverseProxyDelayBudget -v ./internal/proxy

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run ./...
