name: verify

on:
  push:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run performance delay check
        run: go test -run TestReverseProxyDelayBudget -v ./internal/proxy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        timeout-minutes: 5
        with:
          version: v2.11.2
          args: ./...
