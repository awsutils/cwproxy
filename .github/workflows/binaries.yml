name: binaries

on:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    outputs:
      artifact-name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist site/downloads

          targets=(
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "windows amd64 zip"
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch archive <<<"$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            output_dir="dist/${goos}/${goarch}"
            output_bin="${output_dir}/cwproxy${ext}"
            mkdir -p "$output_dir"

            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$output_bin" ./cmd/cwproxy

            archive_name="cwproxy-${goos}-${goarch}"
            if [ "$archive" = "zip" ]; then
              (
                cd "$output_dir"
                zip -q "../../../site/downloads/${archive_name}.zip" "cwproxy${ext}"
              )
            else
              tar -C "$output_dir" -czf "site/downloads/${archive_name}.tar.gz" "cwproxy${ext}"
            fi
          done

          (
            cd site/downloads
            sha256sum * > SHA256SUMS
          )

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>cwproxy downloads</title>
            <style>
              :root {
                color-scheme: light;
                font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
                background: #f7f4eb;
                color: #16202a;
              }
              body {
                margin: 0;
                background:
                  radial-gradient(circle at top left, rgba(194, 136, 66, 0.18), transparent 32rem),
                  linear-gradient(180deg, #f7f4eb 0%, #fffdf7 100%);
              }
              main {
                max-width: 52rem;
                margin: 0 auto;
                padding: 4rem 1.5rem 5rem;
              }
              h1 {
                font-size: clamp(2rem, 5vw, 3.5rem);
                margin: 0 0 0.5rem;
                letter-spacing: -0.05em;
              }
              p {
                max-width: 42rem;
                line-height: 1.6;
              }
              ul {
                padding-left: 1.25rem;
              }
              li {
                margin: 0.75rem 0;
              }
              a {
                color: #0f5c6e;
                font-weight: 600;
                text-decoration-thickness: 0.12em;
              }
              code {
                background: rgba(15, 92, 110, 0.08);
                border-radius: 0.35rem;
                padding: 0.15rem 0.35rem;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>cwproxy</h1>
              <p>Statically linked reverse proxy binaries built from every push.</p>
              <ul>
          EOF

          for file in $(cd site/downloads && ls | sort); do
            printf '                <li><a href="downloads/%s">%s</a></li>\n' "$file" "$file" >> site/index.html
          done

          cat >> site/index.html <<'EOF'
              </ul>
              <p>Checksums are published in <code>downloads/SHA256SUMS</code>.</p>
            </main>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
