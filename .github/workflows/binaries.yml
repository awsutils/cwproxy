name: binaries

on:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    outputs:
      artifact-name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist site
          cp -R page/. site/

          targets=(
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "darwin amd64"
            "darwin arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            output_dir="dist/${goos}/${goarch}"
            output_bin="${output_dir}/cwproxy${ext}"
            mkdir -p "$output_dir"

            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$output_bin" ./cmd/cwproxy

            release_bin="site/cwproxy-${goos}-${goarch}${ext}"
            cp "$output_bin" "$release_bin"
            if [ "$goos" != "windows" ]; then
              chmod 0755 "$release_bin"
            else
              chmod 0644 "$release_bin"
            fi
          done

          (
            cd site
            sha256sum cwproxy-* > SHA256SUMS
          )

          python3 - <<'PY'
          from pathlib import Path

          site = Path("site")
          index_path = site / "index.html"
          template = index_path.read_text(encoding="utf-8")

          items = []
          for path in sorted(site.iterdir(), key=lambda current: current.name):
            if not path.is_file():
              continue
            if path.name in {"index.html", "styles.css"}:
              continue

            description = {
              "SHA256SUMS": "Checksum manifest for every published binary.",
            }.get(path.name, "Statically linked release binary.")

            items.append(
              f'''<article class="download-card">\n'''
              f'''  <h3><a href="{path.name}">{path.name}</a></h3>\n'''
              f'''  <p>{description}</p>\n'''
              f'''</article>'''
            )

          rendered = template.replace("{{DOWNLOAD_ITEMS}}", "\n".join(items))
          index_path.write_text(rendered, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
